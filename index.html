
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little Phone</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #eee9ef;
  font-family: -apple-system, BlinkMacSystemFont, "Arial", sans-serif;
  color: #29252d;
}
.phone {
  width: min(360px, 94vw);
  height: min(740px, 94dvh);
  min-height: 520px;
  border: 8px solid #27242b;
  border-radius: 42px;
  overflow: hidden;
  position: relative;
  background: #fff8fc;
  box-shadow: 0 20px 60px #66516a40;
}
.status {
  height: 38px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 22px;
  font-size: 12px;
  font-weight: bold;
  position: relative;
  z-index: 2;
}
.island {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 23px;
  border-radius: 20px;
  background: #211e24;
}
#screen {
  height: calc(100% - 38px);
  overflow-y: auto;
  position: relative;
  background: linear-gradient(160deg,#fce4ed,#e6e1ff 55%,#d9eff4);
}
#screen.locked {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  background: linear-gradient(155deg,#8f83b5,#d5a9c4,#e9c8bb);
}
.lock-time { font-size: 64px; font-weight: 300; }
.lock-date { font-size: 16px; margin-bottom: 55px; }
.unlock {
  border: 1px solid #ffffffaa;
  background: #ffffff30;
  color: white;
  border-radius: 24px;
  padding: 12px 22px;
  cursor: pointer;
}
.home { min-height: 100%; padding: 20px 18px 26px; }
.widget {
  padding: 17px;
  border-radius: 22px;
  background: #ffffffa8;
  margin: 10px 0 25px;
  backdrop-filter: blur(12px);
}
.widget small { color: #726a7a; }
.widget h1 { margin: 7px 0 3px; font-size: 34px; }
.apps {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 23px 8px;
  text-align: center;
}
.app {
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
  font: inherit;
  font-size: 11px;
}
.app-icon {
  width: 53px;
  height: 53px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 27px;
  margin: 0 auto 7px;
  background: #ffffffd9;
  box-shadow: 0 4px 12px #5b426020;
}
.dock {
  margin-top: 28px;
  padding: 12px 8px;
  border-radius: 25px;
  background: #ffffff80;
  display: flex;
  justify-content: space-around;
}
.dock .app-icon { margin-bottom: 0; }
.page { min-height: 100%; padding: 12px 17px 25px; background: #fff9fc; }
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0 22px;
}
.toolbar h2 { font-size: 25px; margin: 0; flex: 1; }
.back {
  border: 0;
  background: #f0e7f1;
  border-radius: 50%;
  width: 36px;
  height: 36px;
  cursor: pointer;
  font-size: 18px;
}
.card {
  background: white;
  border-radius: 17px;
  padding: 14px;
  margin: 10px 0;
  box-shadow: 0 3px 12px #49324b0d;
}
.muted { color: #88808c; font-size: 12px; }
.chat {
  padding: 10px 12px;
  margin: 10px 0;
  border-radius: 17px;
  max-width: 85%;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
}
.received { background: #eeeaf0; border-bottom-left-radius: 5px; }
.sent {
  background: #d8c5f8;
  margin-left: auto;
  border-bottom-right-radius: 5px;
}
.photos {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 9px;
}
.photo {
  aspect-ratio: 1;
  border-radius: 13px;
  background: linear-gradient(135deg,#f7d6e5,#c5c8ed);
  display: grid;
  place-items: center;
  font-size: 32px;
  overflow: hidden;
}
.photo img { width: 100%; height: 100%; object-fit: cover; }
.note-title { font-weight: bold; margin-bottom: 6px; }
.home-indicator {
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 105px;
  height: 4px;
  border-radius: 8px;
  background: #28242c;
  z-index: 5;
}
#screen.locked ~ .home-indicator { background: white; }
button:focus-visible { outline: 2px solid #8061bb; outline-offset: 3px; }
@media (max-height: 560px) {
  .phone { height: 96dvh; min-height: 0; }
}
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <div class="status">
    <span>9:41</span><span>● ▰ ▰</span>
  </div>
  <main id="screen" class="locked"></main>
  <div class="home-indicator"></div>
</div>

<script>
// ===== 여기부터 네가 내용을 바꾸면 돼! =====
const profile = {
  name: "서윤",
  date: "10월 27일 월요일",
  wallpaper: "linear-gradient(155deg,#8f83b5,#d5a9c4,#e9c8bb)"
};

const messages = [
  { from: "them", text: "뭐 해?", time: "오후 8:30" },
  { from: "me", text: "그냥 네 생각 중", time: "오후 8:31" },
  { from: "them", text: "ㅋㅋㅋㅋ 거짓말", time: "오후 8:32" },
  { from: "me", text: "진짠데 🙄", time: "오후 8:32" }
];

const contacts = [
  { name: "서윤", number: "010-0000-0000", emoji: "🐰" },
  { name: "민지", number: "010-0000-0001", emoji: "🐱" },
  { name: "엄마", number: "010-0000-0002", emoji: "🌷" }
];

const callHistory = [
  { name: "서윤", type: "발신 전화", time: "오후 8:30", emoji: "🐰" },
  { name: "민지", type: "부재중 전화", time: "오후 6:12", emoji: "🐱" }
];

const notes = [
  { title: "꼭 기억하기", body: "우리 처음 만난 날\n2026년 10월 1일 💌" },
  { title: "비밀 메모", body: "오늘 해주고 싶었던 말...\n사실은 네가 많이 보고 싶었어." }
];

// 사진을 추가하려면 아래 photo/ 파일명을 네 사진 파일명으로 바꿔.
// 사진 파일을 index.html과 같은 폴더의 photo 폴더에 넣으면 돼.
const photos = [
  { src: "", emoji: "🌷", caption: "그날의 하늘" },
  { src: "", emoji: "🌅", caption: "노을" },
  { src: "", emoji: "🐈", caption: "귀여운 순간" },
  { src: "", emoji: "💌", caption: "우리의 추억" }
];
// ===== 여기까지 내용 설정 =====

const screen = document.getElementById("screen");

function lockScreen() {
  screen.className = "locked";
  screen.innerHTML = `
    <div style="font-size:35px;margin-bottom:18px">♧</div>
    <div class="lock-date">${profile.date}</div>
    <div class="lock-time">9:41</div>
    <p>♡</p>
    <button class="unlock" onclick="homeScreen()">탭해서 잠금 해제</button>
    <p style="font-size:11px;margin-top:28px">나만의 작은 휴대폰</p>
  `;
  screen.style.background = profile.wallpaper;
}

function homeScreen() {
  screen.className = "";
  screen.style.background = "";
  screen.innerHTML = `
    <div class="home">
      <div style="text-align:right;font-size:12px">✦ ${profile.name}의 휴대폰</div>
      <div class="widget">
        <small>${profile.date}</small>
        <h1>9:41</h1>
        <div>오늘도 좋은 하루 보내기 ☁️</div>
      </div>
      <div class="apps">
        ${app("💬","메시지","messages")}
        ${app("🌄","사진","photos")}
        ${app("☎️","전화","phone")}
        ${app("📝","메모","notes")}
        ${app("⚙️","설정","settings")}
        ${app("🔒","잠금","lock")}
      </div>
      <div class="dock">
        ${app("📞","전화","phone")}
        ${app("💌","메시지","messages")}
        ${app("📷","사진","photos")}
        ${app("🗒️","메모","notes")}
      </div>
      <p style="text-align:center;font-size:11px;color:#786e82;margin-top:25px">
        swipe your little world ♡
      </p>
    </div>`;
}

function app(emoji, label, page) {
  return `<button class="app" onclick="openPage('${page}')">
    <span class="app-icon">${emoji}</span>${label}
  </button>`;
}

function header(title) {
  return `<div class="toolbar">
    <button class="back" onclick="homeScreen()" aria-label="홈으로">‹</button>
    <h2>${title}</h2>
    <button class="back" onclick="lockScreen()" aria-label="잠그기">🔒</button>
  </div>`;
}

function openPage(page) {
  screen.className = "";
  screen.style.background = "";
  if (page === "lock") return lockScreen();

  let content = "";
  if (page === "messages") {
    content = `
      <div class="card" style="text-align:center">
        <div style="font-size:42px">🐰</div>
        <b>${profile.name}</b>
        <div class="muted">iMessage</div>
      </div>
      ${messages.map(m => `
        <div class="chat ${m.from === "me" ? "sent" : "received"}">
          ${m.text}
          <div class="muted" style="text-align:right">${m.time}</div>
        </div>`).join("")}
      <p class="muted" style="text-align:center">이 대화는 미리 작성된 내용이야 ♡</p>`;
  } else if (page === "photos") {
    content = `<div class="photos">${photos.map(p => `
      <div>
        <div class="photo">${p.src
          ? `<img src="${p.src}" alt="${p.caption}">`
          : p.emoji}</div>
        <p class="muted">${p.caption}</p>
      </div>`).join("")}</div>`;
  } else if (page === "phone") {
    content = `<h3>최근 통화</h3>
      ${callHistory.map(c => `
        <div class="card">
          ${c.emoji} <b>${c.name}</b>
          <div class="muted">${c.type} · ${c.time}</div>
        </div>`).join("")}
      <h3 style="margin-top:25px">연락처</h3>
      ${contacts.map(c => `
        <div class="card">
          ${c.emoji} <b>${c.name}</b>
          <div class="muted">${c.number}</div>
        </div>`).join("")}
      <p class="muted">실제 전화는 연결되지 않아.</p>`;
  } else if (page === "notes") {
    content = notes.map(n => `
      <div class="card">
        <div class="note-title">${n.title}</div>
        <div style="white-space:pre-wrap;line-height:1.7">${n.body}</div>
      </div>`).join("");
  } else if (page === "settings") {
    content = `
      <div class="card"><b>배경화면</b>
        <p class="muted">코드의 profile.wallpaper 값을 바꾸면 돼.</p>
      </div>
      <div class="card"><b>잠금 화면</b>
        <p class="muted">오른쪽 위 🔒 버튼으로 언제든 잠글 수 있어.</p>
      </div>
      <div class="card"><b>나만의 휴대폰</b>
        <p class="muted">이 사이트는 데모이며 실제 개인정보나 전화 기능을 사용하지 않아.</p>
      </div>`;
  }

  screen.innerHTML = `<div class="page">${header(
    ({messages:"메시지",photos:"사진",phone:"전화",notes:"메모",settings:"설정"})[page]
  )}${content}</div>`;
}

lockScreen();
</script>
</body>
</html>
